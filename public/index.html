drawSpr0 = function(g, mn, x, y, px, sc) {
  const A = SPR[mn];
  if (!A) return;

  // 1. Detectar los límites reales del dibujo (ignorar espacios vacíos '.')
  let minX = 99, maxX = -1, minY = 99, maxY = -1;
  for (let j = 0; j < A.length; j++) {
    const row = A[j] || '';
    for (let i = 0; i < row.length; i++) {
      if (row[i] && row[i] !== '.') {
        if (i < minX) minX = i;
        if (i > maxX) maxX = i;
        if (j < minY) minY = j;
        if (j > maxY) maxY = j;
      }
    }
  }
  if (maxX < minX) return;

  const realW = maxX - minX + 1;
  const realH = maxY - minY + 1;
  const box = 12 * px;
  const step = Math.max(1, (box * 0.86) / Math.max(realW, realH));
  const ox = x + (box - realW * step) / 2;
  const oy = y + (box - realH * step) / 2;

  const rb = sc === 'rainbow';
  const bc = rb ? RB() : sc;

  g.save();
  g.imageSmoothingEnabled = false;
  for (let j = minY; j <= maxY; j++) {
    const row = A[j] || '';
    for (let i = minX; i <= maxX; i++) {
      const ch = row[i];
      if (!ch || ch === '.') continue;
      let col = PL[ch] || bc || MON[mn].c;
      if (ch === 'b') col = bc || BC[mn] || MON[mn].c;
      else if (ch === 'l') col = LC[mn] || '#fff6d8';
      else if (PLM[mn] && PLM[mn][ch]) col = PLM[mn][ch];
      if (bc && ch !== 'k' && ch !== 'w' && ch !== 'r' && ch !== 'R') {
        col = bc;
      }
      g.fillStyle = col;
      g.fillRect(
        Math.round(ox + (i - minX) * step),
        Math.round(oy + (j - minY) * step),
        Math.ceil(step),
        Math.ceil(step)
      );
    }
  }
  g.restore();
};

let MATCH_SEED = 123456;
function seededRng(seed) {
  let s = (seed || 123456) % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

const TEN_REGIONS = [,   // Pallet Town,  // Mt. Moon,  // Cerulean City,  // Viridian Forest, // Pokémon League, // Rock Tunnel, // Safari Zone,  // Cinnabar Island, // Lago Sur
  [1050, 900]   // Llanura Central
];

const _origStart = start;
start = function() {
  _origStart();
  downed = false;
  spectating = null;
  revTimer = 0;
  revTargetId = null;
  $('rev-box').style.display = 'none';
  $('spec-banner').style.display = 'none';

  if (S.mode === 'br') {
    const rng = seededRng(MATCH_SEED);
    const names = NAMES.slice().sort(() => rng() - 0.5);
    const ks = Object.keys(MON).filter(k => !MON[k].pass);

    // Total de 10 personas en la partida (jugadores reales + bots hasta completar 10)
    const mates = PE.filter(p => p && p.u && p.u !== MYID);
    const totalBots = Math.max(0, 9 - mates.length);
    G.f.length = 1;

    for (let i = 0; i < totalBots; i++) {
      const monName = ks[Math.floor(rng() * ks.length)];
      const bot = mk(monName, names[i % names.length], 1, '');
      const spot = TEN_REGIONS[(i + 1) % TEN_REGIONS.length];
      bot.onp = 1;
      bot.air = 0;
      bot.tx = spot[0] + (rng() - 0.5) * 90;
      bot.ty = spot[1] + (rng() - 0.5) * 90;
      bot.jt = 1.5 + ((i * 1.3) % 12);
      G.f.push(bot);
    }

    // Cofres en posiciones idénticas para todos
    for (let i = 0; i < G.ch.length; i++) {
      const reg = TEN_REGIONS[i % TEN_REGIONS.length];
      G.ch[i].x = Math.max(80, Math.min(WD - 80, reg[0] + (rng() - 0.5) * 420));
      G.ch[i].y = Math.max(80, Math.min(WD - 80, reg[1] + (rng() - 0.5) * 420));
    }
  }
};

// Si eres invitado, sincronizar los bots con los datos en vivo del líder para que sean 100% iguales
const _origUpd = upd;
upd = function(dt) {
  const savedTargets = (G && G.mode === 'br' && G.f)
    ? G.f.map(f => ({ onp: f.onp, tx: f.tx, ty: f.ty }))
    : [];
  _origUpd(dt);
  if (G && G.mode === 'br' && G.f) {
    for (let i = 1; i < G.f.length; i++) {
      if (savedTargets[i] && savedTargets[i].onp && !G.f[i].onp) {
        G.f[i].tx = savedTargets[i].tx;
        G.f[i].ty = savedTargets[i].ty;
      }
    }
    // Si no soy el líder, copiar posición, vida y estado exacto de cada bot desde el líder
    if (R && !isLeader) {
      const leader = PE.find(p => p.leader);
      if (leader && Array.isArray(leader.bots)) {
        leader.bots.forEach((b, idx) => {
          const localBot = G.f[idx + 1];
          if (localBot && b) {
            localBot.x = b.x;
            localBot.y = b.y;
            localBot.hp = b.hp;
            localBot.alive = b.alive;
            localBot.onp = b.onp;
            localBot.air = b.air;
            localBot.mn = b.mn;
            localBot.n = b.n;
          }
        });
      }
    }
  }
};

      isCrit ? '#fff200' : (f.bot ? '#ffffff' : '#ff5252'),
      isCrit
    );

    // Detectar eliminación para anunciar racha de bajas
    if (by && !by.bot && f.hp - finalDmg <= 0) {
      const now = Date.now();
      killStreak = (now - lastKillTs < 12000) ? killStreak + 1 : 1;
      lastKillTs = now;
      const banners = {
        2: '🔥 ¡DOBLE ELIMINACIÓN!',

const GB_PAL = ['#0f380f', '#306230', '#8bac0f', '#9bbc0f'];
function toGBColor(hex) {
  if (!hex || hex !== '#') return '#306230';
  let c = hex.slice(1);
  if (c.length === 3) c = c+c+c+c+c+c;
  const n = parseInt(c, 16);
  const lum = (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
  if (lum < 0.22) return GB_PAL;
  if (lum < 0.48) return GB_PAL;
  if (lum < 0.78) return GB_PAL;
  return GB_PAL;
}

const _drawSpr0GB = drawSpr0;
drawSpr0 = function(g, mn, x, y, px, sc) {
  if (CFG.vis !== 'gb') return _drawSpr0GB(g, mn, x, y, px, sc);
  const A = SPR[mn];
  if (!A) return;
  let minX = 99, maxX = -1, minY = 99, maxY = -1;
  for (let j = 0; j < A.length; j++) {
    const row = A[j] || '';
    for (let i = 0; i < row.length; i++) {
      if (row[i] && row[i] !== '.') {
        if (i < minX) minX = i;
        if (i > maxX) maxX = i;
        if (j < minY) minY = j;
        if (j > maxY) maxY = j;
      }
    }
  }
  if (maxX < minX) return;
  const realW = maxX - minX + 1, realH = maxY - minY + 1;
  const box = 12 * px;
  const step = Math.max(1, (box * 0.86) / Math.max(realW, realH));
  const ox = x + (box - realW * step) / 2, oy = y + (box - realH * step) / 2;

  g.save();
  g.imageSmoothingEnabled = false;
  for (let j = minY; j <= maxY; j++) {
    const row = A[j] || '';
    for (let i = minX; i <= maxX; i++) {
      const ch = row[i];
      if (!ch || ch === '.') continue;
      const rawCol = PL[ch] || MON[mn].c;
      g.fillStyle = ch === 'k' ? '#0f380f' : ch === 'w' ? '#9bbc0f' : toGBColor(rawCol);
      g.fillRect(Math.round(ox + (i - minX) * step), Math.round(oy + (j - minY) * step), Math.ceil(step), Math.ceil(step));
    }
  }
  g.restore();
};
